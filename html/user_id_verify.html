<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Step 1 | FashionFlow</title>
    <link rel="stylesheet" href="../css/recovery.css">
    <link rel="stylesheet" href="../css/user_id_verify.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="recovery-body">

    <div class="recovery-container">
        <!-- Progress Steps -->
        <div class="progress-steps">
            <div class="step active">
                <div class="step-number">1</div>
                <div class="step-label">Find Account</div>
            </div>
            <div class="step">
                <div class="step-number">2</div>
                <div class="step-label">Verify Email</div>
            </div>
            <div class="step">
                <div class="step-number">3</div>
                <div class="step-label">Security</div>
            </div>
            <div class="step">
                <div class="step-number">4</div>
                <div class="step-label">Reset</div>
            </div>
        </div>

        <!-- Header -->
        <div class="recovery-header">
            <div class="recovery-icon">
                <i class="fas fa-lock-open"></i>
            </div>
            <h1 class="recovery-title">Forgot Password?</h1>
            <p class="recovery-subtitle">Enter your User ID below and we'll send a verification code to your email.</p>
        </div>

        <!-- Form -->
        <form class="recovery-form" id="forgotPasswordForm">
            <div id="alertContainer"></div>

            <div class="form-group">
                <label class="form-label" for="user_id">
                    <i class="fas fa-id-card"></i>
                    User ID
                </label>
                <input 
                    type="text" 
                    id="user_id" 
                    name="user_id" 
                    class="form-input" 
                    placeholder="2022-0465"
                    required
                    pattern="\d{4}-\d{4}"
                    autocomplete="off"
                    maxlength="9"
                >
                <small class="input-hint">
                    <i class="fas fa-info-circle"></i>
                    Format: xxxx-xxxx (e.g., 2022-0465)
                </small>
            </div>

            <button type="submit" class="recovery-btn" id="submitButton">
                <span id="btnText">Continue</span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <div class="recovery-links">
                <a href="sign-in.html" class="recovery-link">
                    <i class="fas fa-arrow-left"></i>
                    Back to Sign In
                </a>
            </div>
        </form>
    </div>

    <script src="../php/script.php?dir=js&file=user_id_verify.js" defer></script>
</body>
</html>
