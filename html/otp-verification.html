<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - Step 2 | FashionFlow</title>
    <link rel="stylesheet" href="../css/recovery.css">
    <link rel="stylesheet" href="../css/otp-verification.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="recovery-body">

    <div class="recovery-container">

        <!-- Progress Steps -->
        <div class="progress-steps">
            <div class="step completed">
                <div class="step-number"><i class="fas fa-check"></i></div>
                <div class="step-label">Find Account</div>
            </div>
            <div class="step active">
                <div class="step-number">2</div>
                <div class="step-label">Verify Email</div>
            </div>
            <div class="step">
                <div class="step-number">3</div>
                <div class="step-label">Security</div>
            </div>
            <div class="step">
                <div class="step-number">4</div>
                <div class="step-label">Reset</div>
            </div>
        </div>

        <!-- User Info Display Box -->
        <div class="email-display-box">
            <div class="email-label">
                <i class="fas fa-id-card"></i>
                Account:
            </div>
            <div class="user-info-box">
                <span>
                    <i class="fas fa-hashtag info-icon"></i>
                    <span id="displayUserId">Loading...</span>
                </span>
                <span>
                    <i class="fas fa-user info-icon"></i>
                    <span id="displayUsername">Loading...</span>
                </span>
            </div>
        </div>

        <!-- Header -->
        <div class="recovery-header">
            <div class="recovery-icon">
                <i class="fas fa-envelope-open-text"></i>
            </div>
            <h1 class="recovery-title">Check Your Email</h1>
            <p class="recovery-subtitle">We've sent a 6-digit verification code to your registered email address.</p>
        </div>

        <!-- Email Display Box -->
        <div class="email-display-box">
            <div class="email-label">
                <i class="fas fa-paper-plane"></i>
                Code sent to:
            </div>
            <div id="userEmail" class="email-address">Loading...</div>
        </div>

        <!-- OTP Form -->
        <form class="recovery-form" id="otpForm">
            <div id="alertBox"></div>

            <div class="form-group otp-group">
                <label class="form-label" for="otp">
                    <i class="fas fa-key"></i>
                    Enter 6-Digit Code
                </label>

                <input
                    type="text"
                    name="otp"
                    id="otp"
                    class="form-input otp-input"
                    placeholder="123456"
                    maxlength="6"
                    pattern="\d{6}"
                    required
                    autocomplete="off"
                >

                <!-- Timer Display -->
                <div class="timer-display">
                    <i class="fas fa-clock"></i>
                    Code expires in: <span id="countdown">05:00</span>
                </div>

                <!-- Resend Section -->
                <div id="resendContainer" class="resend-section hidden">
                    <p class="resend-text">Didn't receive the code?</p>
                    <button type="button" id="resendBtn" class="resend-link">
                        <i class="fas fa-redo-alt"></i>
                        Resend Code
                    </button>
                </div>
            </div>

            <!-- Verify Button -->
            <button type="submit" class="recovery-btn" id="verifyBtn">
                <span id="btnText">Verify Code</span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <!-- Back Button -->
            <button type="button" class="recovery-btn recovery-btn-secondary" onclick="window.location.href='user_id_verify.html'">
                <i class="fas fa-arrow-left"></i>
                Back
            </button>
        </form>

    </div>

   
    <script src="../php/script.php?dir=js&file=otp-verification.js" defer></script>
</body>
</html>
